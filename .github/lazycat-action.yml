version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/zammad.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: zammad
    source: zammad/zammad
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    max_tags: 30000
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh-CN
  private:
    enabled: false
